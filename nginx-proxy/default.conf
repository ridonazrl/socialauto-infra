# ==========================================
# ACM (Auto-Comment) - Redirect HTTP to HTTPS
# ==========================================
server {
    listen 80;
    server_name acm.socialauto.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name acm.socialauto.tech;

    ssl_certificate /etc/nginx/ssl/live/acm.socialauto.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/acm.socialauto.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://autocomment-fe:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://auto-like-be:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

