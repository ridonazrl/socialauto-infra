services:
  autolike-be:
    build:
      context: ./autolike/backend
      dockerfile: Dockerfile.backend
    container_name: spammer-backend-new
    restart: unless-stopped
    init: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8081:8081"
    volumes:
      - ./autolike/backend/accounts:/app/accounts
      - ./autolike/backend/cookies:/app/cookies
      - ./autolike/backend/results.json:/app/results.json
    mem_limit: 2g
    cpus: 2.0
    networks:
      - spammer-net

  autolike-fe:
    build:
      context: ./autolike/backend/frontend
      dockerfile: Dockerfile
    container_name: spammer-frontend-new
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - autolike-be
    networks:
      - spammer-net

  autocomment-be:
    build:
      context: ./autocomment/backend
      dockerfile: Dockerfile
    container_name: auto-like-be
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./autocomment/backend/app:/app/app
      - ./autocomment/backend/AutoComment_Python:/app/AutoComment_Python
    networks:
      - spammer-net

  autocomment-fe:
    build:
      context: ./autocomment/frontend
      dockerfile: Dockerfile
    container_name: autocomment-fe
    restart: unless-stopped
    ports:
      - "5175:80"
    networks:
      - spammer-net

  proxy:
    image: nginx:alpine
    container_name: spammer-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - autolike-fe
      - autocomment-fe
      - autocomment-be
      - autolike-be
    networks:
      - spammer-net

networks:
  spammer-net:
    driver: bridge
